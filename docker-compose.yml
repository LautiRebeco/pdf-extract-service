
services:
  pdf-extract:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      APP_NAME: "${APP_NAME:-PDF Extract Service}"
      APP_MAX_PDF_SIZE_BYTES: "${APP_MAX_PDF_SIZE_BYTES:-10485760}"
      APP_EXTRACT_WORKERS: "${APP_EXTRACT_WORKERS:-1}"
      APP_MAX_PENDING_EXTRACTIONS: "${APP_MAX_PENDING_EXTRACTIONS:-16}"
      APP_EXTRACTION_TIMEOUT_SECONDS: "${APP_EXTRACTION_TIMEOUT_SECONDS:-30}"
      APP_SHUTDOWN_TIMEOUT_SECONDS: "${APP_SHUTDOWN_TIMEOUT_SECONDS:-30}"
      APP_OCR_ENABLED: "${APP_OCR_ENABLED:-false}"
      APP_OCR_LANGUAGES: "${APP_OCR_LANGUAGES:-eng+spa}"
      APP_LOG_LEVEL: "${APP_LOG_LEVEL:-INFO}"
      APP_LOG_FORMAT: "${APP_LOG_FORMAT:-text}"
      PORT: "8000"
    init: true
    stop_grace_period: 65s
    cpus: 1.0
    mem_limit: 512m
