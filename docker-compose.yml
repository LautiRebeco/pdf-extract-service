version: "3.9"

services:
  pdf-extract:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_MAX_PDF_SIZE_BYTES=10485760
      - APP_EXTRACT_WORKERS=2
      - APP_MAX_PENDING_EXTRACTIONS=100
      - APP_EXTRACTION_TIMEOUT_SECONDS=30
      - APP_OCR_ENABLED=true
      - APP_OCR_LANGUAGES=eng,spa
      - APP_LOG_LEVEL=DEBUG
      - APP_LOG_FORMAT=text
      - PORT=8000
    volumes:
      - ./app:/app/app:ro  # hot-reload en dev (código)
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health/live', timeout=2).raise_for_status()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # Opcional: Orquestador mock para pruebas de integración
  # mock-orquestador:
