
name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Tesseract and language data
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-spa
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.11.2
          uv sync --locked
      - name: Run static analysis
        run: |
          uv run --locked python -m mypy app
          uv run --locked python -m flake8 --jobs=1 app tests --select E9,F63,F7,F82
      - name: Run tests with coverage
        run: uv run --locked python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=90

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the standalone image
        run: |
          docker build -t pdf-extract-service .
          docker run --detach --init --name pdf-extract-test pdf-extract-service
      - name: Verify the image health check, readiness and OCR languages
        run: |
          for attempt in {1..30}; do
            status=$(docker inspect -f '{{.State.Health.Status}}' pdf-extract-test)
            if [ "$status" = healthy ]; then break; fi
            sleep 2
          done
          test "$status" = healthy
          docker exec pdf-extract-test python -c "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=2).close()"
          docker exec pdf-extract-test tesseract --list-langs | grep -x eng
          docker exec pdf-extract-test tesseract --list-langs | grep -x spa
      - name: Print container logs
        if: failure()
        run: docker logs pdf-extract-test
      - name: Remove test container
        if: always()
        run: docker rm -f pdf-extract-test
